pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/radixdlt/maven-pkg")
            credentials {
                username = System.getenv('GPR_USER')
                password = System.getenv('GPR_TOKEN')
            }
        }
        maven { url 'https://jitpack.io' }
        // Radix Connect over iroh, published by its author (github.com/genkipool/radix-connect-iroh): its group is
        // resolved only from that repository, pinned to a commit of its `maven` branch.
        exclusiveContent {
            forRepository {
                maven { url 'https://raw.githubusercontent.com/genkipool/radix-connect-iroh/d7141726a9bd23362ffad95805661a3d05178ead' }
            }
            filter { includeGroup 'io.github.genkipool' }
        }
    }

}
rootProject.name = "BabylonWallet"
include ':app'
include ':peerdroid'
include ':webrtc-library'
include ':designsystem'
include ':profile'
include ':core'
if (file('arculus-android-csdk/csdknative').exists()) {
    include ':arculus-android-csdk:csdknative'
}
